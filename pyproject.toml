[project]
name = "litreview"
version = "0.1.0"
description = "LitReview: cited literature reviews over arXiv papers on LlamaIndex Workflows (agentic frameworks lab, P2)"
authors = [
    { name = "Soumit", email = "soumit_bhowmick@hotmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==1.17.0",
    "arxiv==4.0.2",
    "fastembed==0.9.1",
    "httpx==0.28.1",
    "llama-agents-dbos==0.7.0",
    "llama-agents-server==0.8.0",
    "llama-index-core==0.14.25",
    "llama-index-embeddings-fastembed==0.7.0",
    "llama-index-llms-anthropic==0.12.3",
    "llama-index-observability-otel==0.7.0",
    "llama-index-readers-file==0.7.0",
    "llama-index-utils-workflow==0.11.0",
    "llama-index-workflows==2.26.1",
    "opentelemetry-sdk==1.45.2",
    "pydantic-settings==2.16.2",
    "pymupdf==2.0",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "rich==15.0.0",
    "typer==0.27.3",
]

[project.scripts]
litreview = "litreview.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# --disable-socket: an accidental live call (Anthropic, arXiv, HF) fails loudly instead of costing money.
# --allow-unix-socket: asyncio's event loop needs a unix socketpair internally.
addopts = "-q --disable-socket --allow-unix-socket"
filterwarnings = [
    # Raised inside llama-index-readers-file (it imports `fitz`), not by our code.
    "ignore:The `fitz` API is deprecated:FutureWarning",
]

[tool.pyright]
include = ["src", "scripts", "evals"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer.Option(...) in defaults is typer's idiom
